<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会社情報とお問い合わせ</title>
    <meta name="description" content="会社情報とお問い合わせ画面です">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>
    <header>
        <!-- ロゴ -->
        <a href="top.html" id="logo">
            <img src="img/logo.svg" alt="TOPページに戻る">
        </a>

        <!-- ナビゲーション -->
        <nav id="nav-pc">
            <ul>
                <li><a href="top.html">TOP</a></li>
                <li><a href="company_contact.html">COMPANY</a></li>
                <li><a href="company_contact.html#customer">CONTACT</a></li>
            </ul>
        </nav>
    </header>   
        <!-- パンくず -->
        <ul class="pankuzu">
            <li>
                <a href="top.html">TOP</a>
            </li>
            <li class="right_arrow">
                >
            </li>
            <li>
                <a href="company_contact.html">会社概要とお問い合わせ</a>
            </li>
        </ul>
    <main>
        <section id="company">
            <div class="subtitle">
                <h1 class="pickup-h1">会社概要</h1>
            </div>
                <table id="company-table">
                    <tr>
                        <th class="tableheader-first">会社名</th>
                        <td class="cell-first">株式会社portfolio</td>
                    </tr>
                    <tr>
                        <th class="tableheader">所在地</th>
                        <td class="cell">〒100-0005　東京都千代田区丸の内１丁目</td>
                    </tr>
                    <tr>
                        <th class="tableheader">設立</th>
                        <td class="cell">XXXX年XX月</td>
                    </tr>
                    <tr>
                        <th class="tableheader">資本金</th>
                        <td class="cell">XXXX万円</td>
                    </tr>
                    <tr>
                        <th class="tableheader">事業内容</th>
                        <td class="cell">サンプル<br>サンプル<br>サンプル</td>
                    </tr>
                    <tr>
                        <th class="tableheader">代表者</th>
                        <td class="cell">三田 恭平</td>
                    </tr>
                </table>
                <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2873.474803308867!2d139.76484174668798!3d35.68125741094041!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188bfbd89f700b%3A0x277c49ba34ed38!2z5p2x5Lqs6aeF!5e0!3m2!1sja!2sjp!4v1722171845410!5m2!1sja!2sjp" 
                width="550" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="map"></iframe>            
          </section>

        <section id="customer">
            <div class="subtitle">
                <h1 class="pickup-h1">お問い合わせ</h1> 
            </div>
                <form>
                    <div class="contact-heading">
                        <div class="contact-main">
                                <label class="contact-label">お名前 </label>
                        </div>
                        <div class="contact-sub">
                                <input type="text" name="name" placeholder="姓" class="contact-textbox">       
                                <input type="text" name="name" placeholder="名" class="contact-textbox">                 
                        </div>
                    </div>
                    <div class="contact-heading">
                        <div class="contact-main">
                            <label class="contact-label">フリガナ</label>
                        </div>
                        <div class="contact-sub">    
                            <input type="text" name="hurigana" placeholder="セイ" class="contact-textbox">
                            <input type="text" name="hurigana" placeholder="メイ" class="contact-textbox">
                        </div>
                    </div>
                    <div class="contact-heading">
                        <div class="contact-main">
                            <label class="contact-label">メールアドレス</label>
                        </div>
                        <div class="contact-sub">
                            <input type="email" name="email" placeholder="入力してください" class="contact-email">
                        </div>
                    </div>
                     <div class="contact-heading">
                        <div class="contact-main">
                            <label class="contact-label">お問い合わせ</label>
                        </div>
                        <div class="contact-sub">
                            <textarea class="contact-textarea" placeholder="お問い合わせ内容をご記載ください" name="message"></textarea>
                        </div>
                        </div>
                    </div>
                    <div class="submitbutton">
                        <input type="submit" value="送信する">    
                    </div>     
                </form> 
        </section>
    </main>
    <footer>
        <!-- フッター内のロゴ -->
        <div class="footer-logo">
            <a href="top.html">
                <img src="img/logo.svg" alt="TOPページに戻る">
            </a>
        </div>

        <!-- フッター内のナビゲーション -->
            <div class="footer-nav">
                <ul class="footer-content">
                    <li><a href="top.html">TOP</a></li>
                    <li><a href="company_contact.html">COMPANY</a></li>
                    <li><a href="company_contact.html#customer">CONTACT</a></li>
                </ul>
            </div>

        <!-- フッター内のコピーライト -->
        <div>
            <p id="copyright">&copy;portfolio</p>
        </div>       
    </footer>
</body>
</html>
